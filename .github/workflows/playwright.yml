name: Playwright Tests
on:
  #Trigger the workflow on push or pull request events to the main or master branches
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    # The workflow will run on the latest version of Ubuntu
    runs-on: ubuntu-latest
    steps:
      #CHECKOUT LATEST CODE
    - uses: actions/checkout@v5
    #SETUP NODEJS
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Run Playwright tests
      env:
        PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}
      run: npx playwright test --config=playwright.service.config.js --workers=4
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30